---
{
  "apiVersion": "v1",
  "kind": "ConfigMap",
  "metadata": {
    "name": "keycloak-theme",
    "namespace": "cloudcart"
  },
  "data": {
    "theme.properties": "# Tema de login CloudCart\n# Parent = base: provee mensajes, plantillas de respaldo (register, reset,\n# update-password, error) y macros (user-profile-commons, register-commons).\nparent=base\n\nlocales=en,es\n\n# CSS del tema (referenciado por template.ftl)\nstyles=css/cloudcart.css\n\n# URL del sitio web (para el link \"Volver a CloudCart\")\nsiteUrl=http://localhost:3000\n\n# ------------------------------------------------------------\n# Clases de los formularios base (kc*). Se definen acá para que\n# los templates base (login/register/reset) emitan markup propio\n# y no dependan del import del tema keycloak.\n# ------------------------------------------------------------\nkcFormClass=cc-form\nkcFormGroupClass=form-group\nkcFormGroupErrorClass=has-error\nkcLabelClass=cc-label\nkcInputClass=cc-input\nkcInputGroup=cc-input-group\nkcInputErrorMessageClass=cc-field-error\nkcInputHelperTextBeforeClass=cc-field-hint\nkcInputHelperTextAfterClass=cc-field-hint\nkcInputClassRadio=cc-radio\nkcInputClassRadioInput=cc-radio-input\nkcInputClassRadioLabel=cc-radio-label\nkcInputClassCheckbox=cc-check\nkcInputClassCheckboxInput=cc-check-input\nkcInputClassCheckboxLabel=cc-check-label\nkcButtonClass=cc-btn\nkcButtonPrimaryClass=cc-btn-primary\nkcButtonBlockClass=cc-btn-block\nkcButtonLargeClass=cc-btn-lg\nkcFormPasswordVisibilityButtonClass=cc-pw-toggle\nkcFormPasswordVisibilityIconShow=cc-pw-icon cc-icon-show\nkcFormPasswordVisibilityIconHide=cc-pw-icon cc-icon-hide\nkcFormOptionsWrapperClass=cc-form-options-right\nkcLabelWrapperClass=\nkcInputWrapperClass=\nkcContentWrapperClass=\nkcFormHeaderClass=\nkcHeaderClass=\nkcBodyClass=\nkcLoginClass=\nkcFormCardClass=\nkcFormAreaClass=\nkcFeedbackAreaClass=\nkcLocaleMainClass=cc-locale\nkcLocaleClass=cc-locale-select\nkcLocaleDropDownClass=cc-locale-dropdown\nkcLocaleListClass=cc-locale-list\nkcLocaleItemClass=cc-locale-link\nkcLocaleListItemClass=cc-locale-list-item\nkcFormSocialAccountListClass=cc-social-list\nkcFormSocialAccountListGridClass=cc-social-grid\nkcFormSocialAccountListButtonClass=cc-social-btn\nkcFormSocialAccountGridItem=cc-social-grid-item\nkcFormSocialAccountNameClass=cc-social-name\nkcFormSocialAccountLinkClass=cc-social-link\nkcFormSocialAccountSectionClass=cc-social-section\nkcResetFlowIcon=cc-restart-icon\nkcFeedbackErrorIcon=cc-ico-error\nkcFeedbackWarningIcon=cc-ico-warning\nkcFeedbackSuccessIcon=cc-ico-success\nkcFeedbackInfoIcon=cc-ico-info\n",
    "template.ftl": "<#-- Shell del tema CloudCart. Reemplaza el wrapper base (patrón y estructura\n     de secciones idénticos a los del tema base, con look de CloudCart). -->\n<#macro registrationLayout bodyClass=\"\" displayInfo=false displayMessage=true displayRequiredFields=false>\n<!DOCTYPE html>\n<html lang=\"es\">\n<head>\n    <meta charset=\"utf-8\">\n    <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\">\n    <meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n    <meta name=\"robots\" content=\"noindex, nofollow\">\n    <title>${msg(\"loginTitle\",(realm.displayName!''))}</title>\n    <link rel=\"icon\" href=\"${url.resourcesPath}/img/logo.svg\">\n    <link href=\"${url.resourcesPath}/css/cloudcart.css\" rel=\"stylesheet\">\n</head>\n<body class=\"cc-body ${bodyClass!}\">\n    <div class=\"cc-accent-bar\"></div>\n\n    <main class=\"cc-main\">\n        <div class=\"cc-card\">\n            <div class=\"cc-logo\">\n                <img src=\"${url.resourcesPath}/img/logo.svg\" alt=\"\" class=\"cc-logo-img\">\n                <span class=\"cc-logo-text\">Cloud<span>Cart</span></span>\n            </div>\n\n            <#-- Mensajes flash (error/success/info) -->\n            <#if displayMessage && message?has_content && (message.type != 'warning' || !isAppInitiatedAction??)>\n                <div class=\"cc-alert cc-alert-${message.type}\" role=\"alert\">\n                    ${kcSanitize(message.summary)?no_esc}\n                </div>\n            </#if>\n\n            <#-- Título de página, o reintento con nombre de usuario -->\n            <#if !(auth?has_content && auth.showUsername() && !auth.showResetCredentials())>\n                <h1 class=\"cc-title\"><#nested \"header\"></h1>\n            <#else>\n                <div class=\"cc-restart\">\n                    <#nested \"show-username\">\n                </div>\n            </#if>\n\n            <div class=\"cc-content\">\n                <#nested \"form\">\n            </div>\n\n            <#if displayInfo>\n                <div class=\"cc-info\">\n                    <#nested \"info\">\n                </div>\n            </#if>\n\n            <#if social?? && social.providers?has_content>\n                <div class=\"cc-divider\"><span>o</span></div>\n                <div class=\"cc-social\">\n                    <#nested \"socialProviders\">\n                </div>\n            </#if>\n        </div>\n\n        <div class=\"cc-footer\">\n            <#if realm.internationalizationEnabled && locale.supported?size gt 1>\n                <div class=\"cc-locale\">\n                    <#list locale.supported as l>\n                        <a href=\"${l.url}\" class=\"${(l.languageTag == locale.currentLanguageTag)?then('cc-locale-active','')}\">${l.label}</a>\n                    </#list>\n                </div>\n            </#if>\n            <a class=\"cc-footer-link\" href=\"${properties.siteUrl!}\">← Volver a CloudCart</a>\n            <span class=\"cc-footer-copy\">© CloudCart · Tienda demo</span>\n        </div>\n    </main>\n</body>\n</html>\n</#macro>\n",
    "cloudcart.css": "/* ============================================================\n   CloudCart — Tema de login Keycloak\n   Paleta alineada con apps/web: blanco + rosa vibrante (rose-600\n   #e11d48 / fuchsia-500 #d946ef), bordes suaves, tipografía sans.\n   ============================================================ */\n\n:root {\n    --cc-primary: #e11d48;\n    --cc-primary-dark: #be123c;\n    --cc-accent: #d946ef;\n    --cc-foreground: #18181b;\n    --cc-muted: #71717a;\n    --cc-border: #e4e4e7;\n    --cc-bg: #faf7f9;\n    --cc-radius: 16px;\n    --cc-shadow: 0 20px 40px -18px rgba(225, 29, 72, 0.18), 0 4px 12px rgba(0, 0, 0, 0.05);\n}\n\n* { box-sizing: border-box; }\n\nhtml, body {\n    margin: 0;\n    padding: 0;\n}\n\nbody.cc-body {\n    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;\n    color: var(--cc-foreground);\n    background: linear-gradient(180deg, #fff 0%, var(--cc-bg) 40%, #fdeef2 100%);\n    min-height: 100vh;\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    -webkit-font-smoothing: antialiased;\n}\n\n/* Barra superior con gradiente rosa */\n.cc-accent-bar {\n    position: fixed;\n    top: 0; left: 0; right: 0;\n    height: 5px;\n    background: linear-gradient(90deg, var(--cc-primary), var(--cc-accent));\n    z-index: 10;\n}\n\n.cc-main {\n    width: 100%;\n    max-width: 420px;\n    padding: 48px 16px 32px;\n    display: flex;\n    flex-direction: column;\n    gap: 20px;\n    flex: 1;\n}\n\n/* Tarjeta */\n.cc-card {\n    background: #fff;\n    border: 1px solid rgba(228, 228, 231, 0.8);\n    border-radius: var(--cc-radius);\n    box-shadow: var(--cc-shadow);\n    padding: 36px 32px 28px;\n}\n\n/* Logo */\n.cc-logo {\n    display: flex;\n    align-items: center;\n    justify-content: center;\n    gap: 10px;\n    margin-bottom: 20px;\n}\n.cc-logo-img { width: 44px; height: 44px; }\n.cc-logo-text {\n    font-size: 24px;\n    font-weight: 800;\n    letter-spacing: -0.03em;\n    color: var(--cc-foreground);\n}\n.cc-logo-text span {\n    background: linear-gradient(90deg, var(--cc-primary), var(--cc-accent));\n    -webkit-background-clip: text;\n    background-clip: text;\n    -webkit-text-fill-color: transparent;\n    color: transparent;\n}\n\n/* Título */\n.cc-title {\n    margin: 0 0 20px;\n    font-size: 20px;\n    font-weight: 700;\n    text-align: center;\n    color: var(--cc-foreground);\n}\n\n/* Reintento con usuario */\n.cc-restart { margin-bottom: 16px; font-size: 14px; text-align: center; }\n.cc-restart #kc-attempted-username { font-weight: 600; display: block; margin-bottom: 8px; }\n.cc-restart #reset-login { color: var(--cc-primary); font-size: 13px; text-decoration: none; }\n.cc-restart #reset-login:hover { text-decoration: underline; }\n\n/* Alertas */\n.cc-alert {\n    margin-bottom: 16px;\n    padding: 12px 14px;\n    border-radius: 12px;\n    font-size: 14px;\n    line-height: 1.4;\n}\n.cc-alert-error   { background: #fef2f2; color: #b91c1c; border: 1px solid #fecaca; }\n.cc-alert-success { background: #ecfdf5; color: #047857; border: 1px solid #a7f3d0; }\n.cc-alert-info    { background: #eff6ff; color: #1d4ed8; border: 1px solid #bfdbfe; }\n.cc-alert-warning { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }\n\n/* ============ Formularios (clases kc*/base) ============ */\n\n.form-group {\n    margin-bottom: 16px;\n}\n\n.form-group label,\n.pf-c-form__label,\n.pf-c-form__label-text,\n.cc-label {\n    display: block;\n    margin-bottom: 6px;\n    font-size: 13px;\n    font-weight: 600;\n    color: var(--cc-foreground);\n}\n\n/* Campos de texto */\n.pf-c-form-control,\n.cc-input,\ninput[type=\"text\"],\ninput[type=\"password\"],\ninput[type=\"email\"],\ninput[type=\"tel\"],\ninput[type=\"number\"],\nselect,\ntextarea {\n    width: 100%;\n    height: 44px;\n    padding: 0 14px;\n    font-size: 15px;\n    color: var(--cc-foreground);\n    background: #fff;\n    border: 1px solid var(--cc-border);\n    border-radius: 10px;\n    outline: none;\n    transition: border-color 0.15s ease, box-shadow 0.15s ease;\n    box-sizing: border-box;\n}\nselect { appearance: auto; }\n\n.pf-c-form-control:focus,\n.cc-input:focus,\ninput:focus, select:focus, textarea:focus {\n    border-color: var(--cc-primary);\n    box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.15);\n}\n\ntextarea { height: auto; min-height: 90px; padding: 10px 14px; }\n\n/* Helpers / mensajes de error de campo */\n.pf-c-form__helper-text,\n.pf-c-form__helper-text-after,\n.pf-c-form__helper-text-before,\n.cc-field-error {\n    display: block;\n    margin-top: 6px;\n    font-size: 12px;\n    color: #dc2626;\n}\n.cc-field-hint {\n    display: block;\n    margin-top: 4px;\n    font-size: 12px;\n    color: var(--cc-muted);\n}\n\n/* Campo con botón de mostrar contraseña */\n.cc-input-group { position: relative; }\n.cc-input-group .cc-input { padding-right: 46px; }\n.cc-pw-toggle {\n    position: absolute;\n    right: 5px;\n    top: 50%;\n    transform: translateY(-50%);\n    background: none;\n    border: none;\n    cursor: pointer;\n    padding: 6px;\n    font-size: 18px;\n    line-height: 1;\n    color: var(--cc-muted);\n}\n.cc-pw-toggle:hover { color: var(--cc-foreground); }\n.cc-icon-show::before { content: '👁️'; }\n.cc-icon-hide::before { content: '🙈'; }\n\n/* Botones */\n#kc-form-buttons { margin-top: 20px; }\n\ninput[type=\"submit\"],\nbutton[type=\"submit\"],\n#kc-login,\n#kc-register,\n.pf-c-button.pf-m-primary,\n.cc-btn.cc-btn-primary {\n    width: 100%;\n    height: 46px;\n    border: none;\n    border-radius: 10px;\n    background: linear-gradient(90deg, var(--cc-primary), var(--cc-accent));\n    color: #fff;\n    font-size: 15px;\n    font-weight: 700;\n    letter-spacing: 0.01em;\n    cursor: pointer;\n    transition: opacity 0.15s ease, transform 0.05s ease, box-shadow 0.15s ease;\n    box-shadow: 0 8px 16px -8px rgba(225, 29, 72, 0.5);\n}\ninput[type=\"submit\"]:hover,\nbutton[type=\"submit\"]:hover,\n.pf-c-button.pf-m-primary:hover {\n    opacity: 0.92;\n    box-shadow: 0 10px 20px -8px rgba(225, 29, 72, 0.6);\n}\ninput[type=\"submit\"]:active { transform: scale(0.99); }\ninput[type=\"submit\"]:disabled,\nbutton[type=\"submit\"]:disabled { opacity: 0.6; cursor: not-allowed; }\n\n/* Opciones del formulario (remember me / olvidé contraseña) */\n#kc-form-options {\n    display: flex;\n    align-items: center;\n    justify-content: space-between;\n    gap: 12px;\n    flex-wrap: wrap;\n    font-size: 13px;\n    margin-bottom: 4px;\n}\n#kc-form-options .checkbox,\n.pf-c-check, .pf-c-radio {\n    display: flex;\n    align-items: center;\n    gap: 6px;\n    color: var(--cc-muted);\n    font-size: 13px;\n    font-weight: 500;\n}\n#kc-form-options input[type=\"checkbox\"],\n.pf-c-check__input, .pf-c-radio__input,\n.cc-check-input, .cc-radio-input,\ninput[type=\"checkbox\"], input[type=\"radio\"] {\n    width: 16px;\n    height: 16px;\n    accent-color: var(--cc-primary);\n}\n#kc-form-options a,\n#kc-form-options .pf-c-form__label a,\n#kc-form-options a[href] {\n    color: var(--cc-primary);\n    font-weight: 600;\n    text-decoration: none;\n}\n#kc-form-options a:hover { text-decoration: underline; }\n.cc-form-options-right { margin-left: auto; }\n\n/* Selector de idioma */\n.cc-locale { display: flex; gap: 8px; font-size: 12px; }\n.cc-locale a { color: var(--cc-muted); text-decoration: none; }\n.cc-locale .cc-locale-active { color: var(--cc-primary); font-weight: 700; }\n\n/* Sección \"info\" (registro, etc.) */\n.cc-info {\n    margin-top: 20px;\n    padding-top: 18px;\n    border-top: 1px solid var(--cc-border);\n    text-align: center;\n    font-size: 14px;\n    color: var(--cc-muted);\n}\n.cc-info a { color: var(--cc-primary); font-weight: 600; text-decoration: none; }\n.cc-info a:hover { text-decoration: underline; }\n\n/* Divisor social */\n.cc-divider {\n    display: flex;\n    align-items: center;\n    gap: 12px;\n    margin: 22px 0 14px;\n    color: var(--cc-muted);\n    font-size: 12px;\n}\n.cc-divider::before, .cc-divider::after {\n    content: \"\";\n    flex: 1;\n    height: 1px;\n    background: var(--cc-border);\n}\n.cc-social { display: flex; flex-direction: column; gap: 8px; }\n.kc-social-item { display: block; width: 100%; }\n.kc-social-provider-name { font-size: 14px; font-weight: 600; }\n\n/* Página de error */\n#kc-error-message { text-align: center; }\n#kc-error-message .cc-title { margin-bottom: 8px; }\n#kc-error-message #kc-error-details { font-size: 14px; color: var(--cc-muted); }\n\n/* Pie */\n.cc-footer {\n    display: flex;\n    flex-direction: column;\n    align-items: center;\n    gap: 6px;\n    font-size: 13px;\n    color: var(--cc-muted);\n    text-align: center;\n}\n.cc-footer-link {\n    color: var(--cc-primary);\n    font-weight: 600;\n    text-decoration: none;\n}\n.cc-footer-link:hover { text-decoration: underline; }\n.cc-footer-copy { font-size: 12px; }\n\n/* Register: grupos de campos dinámicos */\n.pf-c-form__group { margin-bottom: 16px; }\n.required { color: var(--cc-primary); }\n.subtitle, .form-horizontal .subtitle { font-size: 12px; color: var(--cc-muted); margin-bottom: 14px; }\n.form-horizontal .pf-c-form__label { margin-bottom: 6px; }\n\n/* Responsive */\n@media (max-width: 480px) {\n    .cc-main { padding: 36px 12px 24px; }\n    .cc-card { padding: 28px 20px 24px; }\n    .cc-logo-text { font-size: 22px; }\n}\n",
    "passwordVisibility.js": "// Toggle de visibilidad de contraseña (clon del base theme).\nconst toggle = (button) => {\n    const passwordElement = document.getElementById(button.getAttribute('aria-controls'));\n    if (passwordElement.type === 'password') {\n        passwordElement.type = 'text';\n        button.children.item(0).className = button.dataset.iconHide;\n        button.setAttribute('aria-label', button.dataset.labelHide);\n    } else if (passwordElement.type === 'text') {\n        passwordElement.type = 'password';\n        button.children.item(0).className = button.dataset.iconShow;\n        button.setAttribute('aria-label', button.dataset.labelShow);\n    }\n};\n\ndocument.querySelectorAll('[data-password-toggle]').forEach((button) => {\n    button.onclick = () => toggle(button);\n});\n",
    "logo.svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 64 64\" role=\"img\" aria-label=\"CloudCart\">\n  <defs>\n    <linearGradient id=\"g\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n      <stop offset=\"0\" stop-color=\"#e11d48\"/>\n      <stop offset=\"1\" stop-color=\"#d946ef\"/>\n    </linearGradient>\n  </defs>\n  <rect width=\"64\" height=\"64\" rx=\"14\" fill=\"url(#g)\"/>\n  <path d=\"M20 27h24l-2.4 14a4 4 0 0 1-3.9 3.2H26.3a4 4 0 0 1-3.9-3.2L20 27z\"\n        fill=\"none\" stroke=\"#fff\" stroke-width=\"3.2\" stroke-linejoin=\"round\"/>\n  <path d=\"M26.5 27v-5a5.5 5.5 0 0 1 11 0v5\"\n        fill=\"none\" stroke=\"#fff\" stroke-width=\"3.2\" stroke-linecap=\"round\"/>\n</svg>\n"
  }
}
