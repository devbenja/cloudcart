apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:25.0
          args: ["start-dev", "--import-realm"]
          ports:
            - containerPort: 8080
          env:
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: KEYCLOAK_ADMIN
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: KEYCLOAK_ADMIN_PASSWORD
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: KC_PROXY_HEADERS
              value: xforwarded
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import/realm-cloudcart.json
              subPath: realm-cloudcart.json
              readOnly: true
            - name: theme
              mountPath: /opt/keycloak/themes/cloudcart/login/theme.properties
              subPath: theme.properties
              readOnly: true
            - name: theme
              mountPath: /opt/keycloak/themes/cloudcart/login/template.ftl
              subPath: template.ftl
              readOnly: true
            - name: theme
              mountPath: /opt/keycloak/themes/cloudcart/login/resources/css/cloudcart.css
              subPath: cloudcart.css
              readOnly: true
            - name: theme
              mountPath: /opt/keycloak/themes/cloudcart/login/resources/js/passwordVisibility.js
              subPath: passwordVisibility.js
              readOnly: true
            - name: theme
              mountPath: /opt/keycloak/themes/cloudcart/login/resources/img/logo.svg
              subPath: logo.svg
              readOnly: true
          readinessProbe:
            httpGet:
              path: /realms/cloudcart
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
      volumes:
        - name: realm-import
          configMap:
            name: keycloak-realm
        - name: theme
          configMap:
            name: keycloak-theme
