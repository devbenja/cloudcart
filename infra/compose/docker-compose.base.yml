# CloudCart - Servicios base para desarrollo local
# Levanta: PostgreSQL, MongoDB, Redis, Keycloak

services:
  # PostgreSQL: datos transaccionales (usuarios, pedidos, pagos)
  postgres:
    image: postgres:16-alpine
    container_name: cloudcart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudcart
      POSTGRES_PASSWORD: cloudcart_dev_password
      POSTGRES_DB: cloudcart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudcart"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB: catálogo de productos, reviews, configuración
  mongo:
    image: mongo:7
    container_name: cloudcart-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: cloudcart
      MONGO_INITDB_ROOT_PASSWORD: cloudcart_dev_password
      MONGO_INITDB_DATABASE: cloudcart
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis: carrito, sesiones, cache, rate limiting
  redis:
    image: redis:7-alpine
    container_name: cloudcart-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Keycloak: identity provider (OAuth2 + OIDC + multi-tenant)
  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: cloudcart-keycloak
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - ./keycloak/realm-config.json:/opt/keycloak/data/import/realm-cloudcart.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  # Apache Kafka: bus de eventos (modo KRaft, sin Zookeeper)
  kafka:
    image: apache/kafka:3.7.0
    container_name: cloudcart-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # Kafka UI: dashboard para visualizar topics y mensajes en vivo
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cloudcart-kafka-ui
    restart: unless-stopped
    ports:
      - "8280:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: cloudcart
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
