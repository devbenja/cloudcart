# Tema de login CloudCart
# Parent = base: provee mensajes, plantillas de respaldo (register, reset,
# update-password, error) y macros (user-profile-commons, register-commons).
parent=base

locales=en,es

# CSS del tema (referenciado por template.ftl)
styles=css/cloudcart.css

# URL del sitio web (para el link "Volver a CloudCart")
siteUrl=http://localhost:3000

# ------------------------------------------------------------
# Clases de los formularios base (kc*). Se definen acá para que
# los templates base (login/register/reset) emitan markup propio
# y no dependan del import del tema keycloak.
# ------------------------------------------------------------
kcFormClass=cc-form
kcFormGroupClass=form-group
kcFormGroupErrorClass=has-error
kcLabelClass=cc-label
kcInputClass=cc-input
kcInputGroup=cc-input-group
kcInputErrorMessageClass=cc-field-error
kcInputHelperTextBeforeClass=cc-field-hint
kcInputHelperTextAfterClass=cc-field-hint
kcInputClassRadio=cc-radio
kcInputClassRadioInput=cc-radio-input
kcInputClassRadioLabel=cc-radio-label
kcInputClassCheckbox=cc-check
kcInputClassCheckboxInput=cc-check-input
kcInputClassCheckboxLabel=cc-check-label
kcButtonClass=cc-btn
kcButtonPrimaryClass=cc-btn-primary
kcButtonBlockClass=cc-btn-block
kcButtonLargeClass=cc-btn-lg
kcFormPasswordVisibilityButtonClass=cc-pw-toggle
kcFormPasswordVisibilityIconShow=cc-pw-icon cc-icon-show
kcFormPasswordVisibilityIconHide=cc-pw-icon cc-icon-hide
kcFormOptionsWrapperClass=cc-form-options-right
kcLabelWrapperClass=
kcInputWrapperClass=
kcContentWrapperClass=
kcFormHeaderClass=
kcHeaderClass=
kcBodyClass=
kcLoginClass=
kcFormCardClass=
kcFormAreaClass=
kcFeedbackAreaClass=
kcLocaleMainClass=cc-locale
kcLocaleClass=cc-locale-select
kcLocaleDropDownClass=cc-locale-dropdown
kcLocaleListClass=cc-locale-list
